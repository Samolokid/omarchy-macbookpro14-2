# Stability fixes for the Broadcom BCM43602 (brcmfmac) WiFi chip in this
# MacBookPro14,2: the firmware runs out of internal resources when the P2P
# device interface is repeatedly torn down/recreated (seen as wpa_supplicant
# "Failed to create interface p2p-dev-wlp2s0: -12 (Cannot allocate memory)"
# followed by permanent scan failures, requiring a reboot to recover).
# WiFi Direct/P2P is not used on this machine, so stop NetworkManager from
# managing that pseudo-device at all, and stop it from randomizing the MAC
# on every scan (which is what churns the interface repeatedly).

[device]
match-device=type:wifi-p2p
managed=0

[connection]
wifi.scan-rand-mac-address=no
